server {
    listen 80;
    server_name _;

    # Serve React static assets
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-file routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE requests to the Flask backend
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) streaming
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Disable buffering so SSE chunks are flushed immediately
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # Keep the connection alive long enough for slow scans
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}